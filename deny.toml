# Politique de dépendances (D67, D68, D71). Toute exception est écrite, motivée et réexaminée (D73).
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# D67 : licences autorisées par défaut. GPL, AGPL, LGPL et licences inconnues refusées (D68).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
