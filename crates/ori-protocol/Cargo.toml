[package]
name = "ori-protocol"
version = "0.0.0"
description = "Contrat public d'ORI : messages, erreurs, schémas, risque et capacités."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
uuid = { version = "=1.29.2", default-features = false, features = ["std", "serde"] }
schemars = { version = "=1.2.3", default-features = false, features = ["std", "derive", "uuid1"] }

[lints]
workspace = true
